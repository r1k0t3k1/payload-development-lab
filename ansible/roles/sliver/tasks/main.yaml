---
- name: Sliverの最新バージョン取得
  ansible.builtin.uri:
    url: "https://api.github.com/repos/BishopFox/sliver/releases/latest"
    status_code: 200
  delegate_to: localhost
  register: sliver_version

- name: Sliverのバイナリダウンロード
  ansible.builtin.get_url:
    url: "{{ item }}"
    dest: "{{ playbook_dir }}/roles/sliver/files/{{ item | basename }}"
  delegate_to: localhost
  run_once: true
  loop:
    - "https://github.com/BishopFox/sliver/releases/download/{{ sliver_version['json']['tag_name'] }}/sliver-server_linux-amd64"
    - "https://github.com/BishopFox/sliver/releases/download/{{ sliver_version['json']['tag_name'] }}/sliver-client_linux-amd64"

- name: Sliver用のディレクトリ作成
  ansible.builtin.file:
    path: /opt/sliver
    state: directory
    mode: '0755'
  become: true

- name: ターゲットノードにSliverのバイナリをアップロード
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/roles/sliver/files/{{ item }}"
    dest: "/opt/sliver/{{ item }}"
    owner: ubuntu
    group: ubuntu
    mode: 0744
  become: true
  run_once: true
  loop:
    - "sliver-server_linux-amd64"
    - "sliver-client_linux-amd64"

- name: Sliverのサービス作成
  ansible.builtin.copy:
    dest: /etc/systemd/system/sliver.service
    content: |
      [Unit]
      Description=Sliver
      After=network.target
      StartLimitIntervalSec=0
      
      [Service]
      Type=simple
      Restart=on-failure
      RestartSec=3
      User=root
      ExecStart=/opt/sliver/sliver-server_linux-amd64 daemon
      
      [Install]
      WantedBy=multi-user.target
  become: true

- name: Sliver Server起動 & 有効化
  ansible.builtin.systemd:
    name: sliver
    enabled: true
    state: started
    daemon_reload: true
  become: true
