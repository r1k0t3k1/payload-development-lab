---
- name: Elasticsearch が応答するまで待つ
  ansible.builtin.uri:
    url: "https://{{ ansible_host }}:9200"
    validate_certs: false
    status_code: 401
  register: es_up
  retries: 30
  delay: 5

- name: Kibanaの設定ファイルをコピー
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/roles/kibana/files/kibana.yml"
    dest: "/opt/kibana-{{ es_version }}/config/"
    owner: ubuntu
    group: ubuntu
    mode: 0644
    force: true
  run_once: true

- name: ElasticSearchでKibanaのエンロールトークン発行
  ansible.builtin.shell:
    cmd: bin/elasticsearch-create-enrollment-token -s kibana
    chdir: "/opt/elasticsearch-{{ es_version }}"
  run_once: true
  retries: 3
  delay: 10
  register: enrollment_token

- name: KibanaをElasticSearchにEnroll
  ansible.builtin.shell:
    cmd: "bin/kibana-setup --enrollment-token {{ enrollment_token.stdout }}"
    chdir: "/opt/kibana-{{ es_version }}"
  run_once: true
  register: enrollment_result

- name: Kibanaのサービス作成
  ansible.builtin.copy:
    dest: /etc/systemd/system/kibana.service
    content: |
      [Unit]
      Description=Kibana
      After=network.target

      [Service]
      Type=simple
      User=ubuntu
      ExecStart=/opt/kibana-{{ es_version }}/bin/kibana
      Restart=on-failure
      LimitNOFILE=65536

      [Install]
      WantedBy=multi-user.target
  become: true

- name: Kibana起動動 & 有効化
  ansible.builtin.systemd:
    name: kibana
    enabled: true
    state: started
    daemon_reload: true
  become: true

- name: Kibanaの起動待ち
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 5601
    delay: 10
    timeout: 180

- name: Fleet Server追加用のService Tokenを発行
  ansible.builtin.uri:
    url: "http://127.0.0.1:5601/api/fleet/service_tokens"
    method: POST
    user: elastic
    password: "{{ hostvars['elk']['elasticsearch_login_password'] }}"
    force_basic_auth: true
    headers:
      kbn-xsrf: "true"
    validate_certs: false
    status_code: 200
  retries: 3
  delay: 10
  register: fleet_token
  no_log: true

- name: ElasticSearchのCA証明書のフィンガープリント取得
  ansible.builtin.shell: >
    openssl x509 -noout -fingerprint -sha256
    -in /opt/elasticsearch-{{ es_version }}/config/certs/http_ca.crt
    | sed 's/.*=//; s/://g' | tr '[:upper:]' '[:lower:]'
  register: ca_fp
  changed_when: false

- name: Fleet Server Hostを追加
  ansible.builtin.uri:
    url: "http://127.0.0.1:5601/api/fleet/fleet_server_hosts"
    method: POST
    user: elastic
    password: "{{ hostvars['elk']['elasticsearch_login_password'] }}"
    force_basic_auth: true
    headers: { kbn-xsrf: "true" }
    body_format: json
    body:
      host_urls: ["https://{{ ansible_host }}:8220"]
      is_default: true
      name: "Fleet Server"
    validate_certs: false
    status_code: 200
  register: host

- name: Fleet Server ポリシーを作成（統合込み）
  ansible.builtin.uri:
    url: "http://127.0.0.1:5601/api/fleet/agent_policies"
    method: POST
    user: elastic
    password: "{{ hostvars['elk']['elasticsearch_login_password'] }}"
    force_basic_auth: true
    headers: { kbn-xsrf: "true" }
    body_format: json
    body:
      name: "Fleet Server Policy"
      namespace: "default"
      has_fleet_server: true       # ← これでFleet Server統合が入る
    validate_certs: false
    status_code: 200
  register: policy

- name: Fleet Serverをインストール
  ansible.builtin.command: >
    ./elastic-agent install -f
    --fleet-server-es=https://127.0.0.1:9200
    --fleet-server-policy={{ policy.json.item.id }}
    --fleet-server-service-token={{ fleet_token.json.value }}
    --fleet-server-es-ca-trusted-fingerprint={{ ca_fp.stdout }}
    --fleet-server-port=8220
    --install-servers
  args:
    chdir: /opt/elastic-agent-{{ es_version }}-linux-x86_64
  become: true
  register: fleet_install

- name: VictimにAgent用のポリシーを作成
  ansible.builtin.uri:
    url: "http://127.0.0.1:5601/api/fleet/agent_policies"
    method: POST
    user: elastic
    password: "{{ hostvars['elk']['elasticsearch_login_password'] }}"
    force_basic_auth: true
    headers: { kbn-xsrf: "true" }
    body_format: json
    body:
      name: "Victim Agent Policy"
      namespace: "default"
      monitoring_enabled: [
        "logs",
        "metrics",
        "traces"
      ]
    validate_certs: false
    status_code: 200
  register: victim_policy

- name: Elastic Defendのバージョンを取得
  ansible.builtin.uri:
    url: "http://127.0.0.1:5601/api/fleet/epm/packages/endpoint?full=true&prerelease=false"
    method: GET
    user: elastic
    password: "{{ hostvars['elk']['elasticsearch_login_password'] }}"
    force_basic_auth: true
    headers: { kbn-xsrf: "true" }
    validate_certs: false
    status_code: 200
  register: version

- name: Elastic Defend を VICTIM ポリシーに追加
  ansible.builtin.uri:
    url: "http://127.0.0.1:5601/api/fleet/package_policies"
    method: POST
    user: elastic
    password: "{{ hostvars['elk']['elasticsearch_login_password'] }}"
    force_basic_auth: true
    headers:
      kbn-xsrf: "true"
    body_format: json
    body: # 実際に飛ぶリクエストから持ってきた
      name: "Victim-Defend"
      description: ""
      namespace: "default"
      policy_id: "{{ victim_policy.json.item.id }}"
      policy_ids: ["{{ victim_policy.json.item.id }}"]
      enabled: true
      inputs:
        - enabled: true
          streams: []
          type: "ENDPOINT_INTEGRATION_CONFIG"
          config:
            _config:
              value:
                type: "endpoint"
                endpointConfig:
                  preset: "EDRComplete"
      package:
        name: "endpoint"
        title: "Elastic Defend"
        version: "{{ version.json.item.version }}"
      force: false
      create_dataset_templates: true
    validate_certs: false
    status_code: [200]
    timeout: 300
  register: defend

- name: prebuiltの検知ルールをすべてインストール
  ansible.builtin.uri:
    url: "http://127.0.0.1:5601/api/detection_engine/rules/prepackaged"
    method: PUT
    user: elastic
    password: "{{ hostvars['elk']['elasticsearch_login_password'] }}"
    force_basic_auth: true
    headers:
      kbn-xsrf: "true"
    validate_certs: false
    status_code: [200]
    timeout: 300
  register: install_prebuilt_rules

- name: ルールを有効化
  ansible.builtin.uri:
    url: "http://127.0.0.1:5601/api/detection_engine/rules/_bulk_action"
    method: POST
    user: elastic
    password: "{{ hostvars['elk']['elasticsearch_login_password'] }}"
    force_basic_auth: true
    headers:
      kbn-xsrf: "true"
    body_format: json
    body:
      action: "enable"
      query: "{{ item.query }}"
    validate_certs: false
    status_code: 200
    timeout: 60
  register: bulk_enable
  loop: #1000件以上は一気に有効化できなかったので分割実行
    - { query: 'alert.attributes.tags: "OS: Windows" AND alert.attributes.tags: "Data Source: Elastic Defend"' } # 件数絞るため
    - { query: 'alert.attributes.tags: "Data Source: Elastic Defend" AND NOT alert.attributes.tags: "OS: Windows"' } # Elastic Defend系のみ
    - { query: 'alert.attributes.tags: "OS: Windows" AND NOT alert.attributes.tags: "Data Source: Elastic Defend"' } # Windowsのみ

- name: MCPサーバー応答確認
  ansible.builtin.uri:
    url: "http://127.0.0.1:5601/api/agent_builder/mcp"
    method: POST
    headers:
      Authorization: "ApiKey {{ hostvars['elk']['elasticsearch_api_key'] }}"
      Content-Type: "application/json"
      Accept: "application/json,text/event-stream"
      kbn-xsrf: "true"
    body_format: json
    body:
      id: 1
      jsonrpc: "2.0"
      method: "initialize"
      params: 
        protocolVersion: "2024-11-05"
        capabilities: {}
        clientInfo: 
          name: "test-client"
          version: "1.0.0"
    validate_certs: false
    status_code: 200
  register: mcp_check

- name: MCP debug
  ansible.builtin.debug:
    msg: "{{ mcp_check }}"
- name: ElasticSearchでVictimのエンロールトークン発行
  ansible.builtin.uri:
    url: "http://127.0.0.1:5601/api/fleet/enrollment_api_keys?kuery=policy_id:{{ victim_policy.json.item.id }}"
    method: GET
    user: elastic
    password: "{{ hostvars['elk']['elasticsearch_login_password'] }}"
    force_basic_auth: true
    headers:
      kbn-xsrf: "true"
    validate_certs: false
    status_code: 200
  register: enrollment_api_key

- name: Elastic Defend Enrollment token
  ansible.builtin.debug:
    msg: "{{ enrollment_api_key }}"

- name: factsにトークンを設定
  ansible.builtin.set_fact:
    victim_enrollment_token: "{{ enrollment_api_key.json['items'][0].api_key }}"
