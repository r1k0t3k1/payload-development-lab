---
- name: go installerのダウンロード
  ansible.windows.win_get_url:
    url: https://go.dev/dl/go1.27.4.windows-amd64.msi
    dest: C:\Users\{{ ansible_user }}\go.msi

- name: goのインストール
  ansible.windows.win_package:
    path: C:\Users\{{ ansible_user }}\go.msi
    state: present

- name: 再接続してPATH読み直し
  ansible.builtin.meta: reset_connection

- name: goのインストール確認
  ansible.windows.win_shell: go version
  register: go_version

- name: goのバージョン
  ansible.builtin.debug:
    msg: "{{ go_version.stdout }}"
