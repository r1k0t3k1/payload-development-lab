---
- name: コントロールノードにElasticSearchのパッケージをダウンロード
  ansible.builtin.get_url:
    url: "{{ item }}"
    dest: "{{ playbook_dir }}/roles/elasticsearch/files/{{ item | basename }}"
  delegate_to: localhost
  run_once: true
  loop:
    - "https://artifacts.elastic.co/downloads/elasticsearch/elasticsearch-{{ es_version }}-linux-x86_64.tar.gz"
    - "https://artifacts.elastic.co/downloads/kibana/kibana-{{ es_version }}-linux-x86_64.tar.gz"
    - "https://artifacts.elastic.co/downloads/beats/elastic-agent/elastic-agent-{{ es_version }}-linux-x86_64.tar.gz"

- name: ターゲットノードにElasticSearchのパッケージをアップロード
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/roles/elasticsearch/files/{{ item }}"
    dest: "/tmp/{{ item }}"
    owner: ubuntu
    group: ubuntu
    mode: 0644
  become: true
  run_once: true
  loop:
    - "elasticsearch-{{ es_version }}-linux-x86_64.tar.gz"
    - "kibana-{{ es_version }}-linux-x86_64.tar.gz"
    - "elastic-agent-{{ es_version }}-linux-x86_64.tar.gz"

- name: ターゲットノード上でElasticSearchのパッケージを解凍
  ansible.builtin.unarchive:
    src: "/tmp/{{ item.src }}"
    dest: "/opt/"
    remote_src: yes
    owner: ubuntu
    group: ubuntu
    creates: "/opt/{{ item.dest }}"
  become: true
  run_once: true
  loop:
    - { src: "elasticsearch-{{ es_version }}-linux-x86_64.tar.gz", dest: "elasticsearch-{{ es_version }}" }
    - { src: "kibana-{{ es_version }}-linux-x86_64.tar.gz",        dest: "kibana-{{ es_version }}" }
    - { src: "elastic-agent-{{ es_version }}-linux-x86_64.tar.gz", dest: "elastic-agent-{{ es_version }}-linux-x86_64" }

- name: ターゲットノードにElasticSearchの設定ファイルをアップロード
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/roles/elasticsearch/files/elasticsearch.yml"
    dest: "/opt/elasticsearch-{{ es_version }}/config/"
    owner: ubuntu
    group: ubuntu
    mode: 0644
    force: false
  run_once: true

- name: ElasticSearchをバックグラウンドで実行
  ansible.builtin.shell: 
    cmd: nohup bin/elasticsearch -d -p pid &
    chdir: /opt/elasticsearch-{{ es_version }}
  run_once: true

- name: Elasticsearchのパスワードリセット
  ansible.builtin.shell:
    cmd: bin/elasticsearch-reset-password -u elastic -b -s
    chdir: /opt/elasticsearch-{{ es_version }}
  run_once: true
  delay: 30
  retries: 3
  register: elastic_password

- name: ElasticSearchのパスワードをホスト変数に保存
  ansible.builtin.set_fact:
    elasticsearch_login_password: "{{ elastic_password.stdout }}"

- name: ElasticSearchのAPIキーを発行
  ansible.builtin.uri:
    url: "https://localhost:9200/_security/api_key"
    method: POST
    user: elastic
    password: "{{ elastic_password.stdout }}"
    force_basic_auth: true
    body_format: json
    body:
      name: "for-mcp-server"
    validate_certs: false
    status_code: 200

- name: ElasticSearchのtrial開始
  ansible.builtin.uri:
    url: "https://localhost:9200/_license/start_trial?acknowledge=true"
    method: POST
    user: elastic
    password: "{{ elastic_password.stdout }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
    
- name: ElasticSearchのtrialライセンス有効化待ち
  ansible.builtin.uri:
    url: "https://localhost:9200/_license"
    method: GET
    user: elastic
    password: "{{ elastic_password.stdout }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: license_result
  ignore_errors: yes
  until: license_result['json']['license']['type'] == "trial"  
  retries: 5
  delay: 10

