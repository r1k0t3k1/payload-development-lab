---
- name: Terraformによるインフラ構築 & inventory.iniの作成
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    dev_user: dev

  tasks:
    - name: terraform applyの実行
      cloud.terraform.terraform:
        project_path: "{{ playbook_dir }}/../terraform"
        state: present
        force_init: true
      register: terraform
    
    - name: show terraform output
      debug:
        var: terraform.stdout_lines

    - name: Linuxホストの追加
      add_host:
        name: "{{ item.name }}"
        groups: "{{ item.group }}, linux"
        ansible_host: "{{ item.ip }}"
        ansible_user: "{{ item.username }}"
        ansible_ssh_private_key_file: "{{ playbook_dir }}/../terraform/keys/dev_id_ed25519"
        ansible_ssh_common_args: >-
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10
            -o ProxyCommand="ssh -W %h:%p -i {{ playbook_dir }}/../terraform/keys/dev_id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null dev@{{ terraform.outputs.dev_global_ip.value }}"
            -i {{ playbook_dir }}/../terraform/keys/{{ item.sshkey }}
      loop:
        - { name: "elk",      group: elk,      ip: "{{ terraform.outputs.elk_private_ip.value }}",      username: "ubuntu", sshkey: "elk_id_ed25519" }
        - { name: "attacker", group: attacker, ip: "{{ terraform.outputs.attacker_private_ip.value }}", username: "ubuntu", sshkey: "attacker_id_ed25519" }

    - name: Windowsホストの追加
      add_host:
        name: "{{ item.name }}"
        groups: "{{ item.group }}, windows"
        ansible_host: "{{ item.ip }}"
        ansible_user: "{{ item.username }}"
        ansible_connection: ssh
        ansible_shell_type: cmd
        ansible_ssh_private_key_file: "{{ playbook_dir }}/../terraform/keys/dev_id_ed25519"
        ansible_ssh_common_args: >-
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10
            -o ProxyCommand="ssh -W %h:%p -i {{ playbook_dir }}/../terraform/keys/dev_id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null dev@{{ terraform.outputs.dev_global_ip.value }}"
            -i {{ playbook_dir }}/../terraform/keys/{{ item.sshkey }}
      loop:
        - { name: "victim", group: victim,   ip: "{{ terraform.outputs.victim_private_ip.value }}",   username: "victim_admin", sshkey: "victim_admin_id_ed25519" }

